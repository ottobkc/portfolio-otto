# -----------------------------------------------
# NETLIFY · mirardespacio.es (sitio independiente)
# Base directory en Netlify: MirarDespacio
# -----------------------------------------------
[build]
  publish = "."
  # Solo construye si ha cambiado algo dentro de MirarDespacio/ (ahorra créditos)
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# La clave web de Firebase (AIza…) es pública por diseño: va en el navegador y la
# protegen las reglas de Firestore. El escáner de secretos de Netlify (plan Pro) la
# marca como sospechosa y para el deploy; se la indicamos como conocida.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDfRTs1pF5-iV2dlNFY-dlFv4A-HcxZeTk"

[[redirects]]
  from   = "https://www.mirardespacio.es/*"
  to     = "https://mirardespacio.es/:splat"
  status = 301
  force  = true

# Direcciones que puede tener la gente guardadas
[[redirects]]
  from   = "/salidas.html"
  to     = "/salidas/"
  status = 301

# Calendario para suscribirse (Google/Apple): lo genera una función de ottokols.es
[[redirects]]
  from   = "/agenda.ics"
  to     = "https://ottokols.es/.netlify/functions/agenda?formato=ics"
  status = 200
  force  = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/salidas-data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
