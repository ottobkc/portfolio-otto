<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Mirar Despacio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/logo-md-ig.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Inter:wght@400;500&display=swap">
  <style>
    :root { --crema:#f5f3ef; --tinta:#1a1814; --gris:#6b655a; --linea:#d8d2c6; --rosa:#e8347a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--crema); color:var(--tinta);
           font:17px/1.6 "Inter",system-ui,sans-serif; padding:24px 16px; }
    main { width:100%; max-width:420px; text-align:center; }
    img { width:64px; height:64px; object-fit:contain; margin:0 auto 20px; display:block; }
    h1 { font:400 clamp(2.2rem,8vw,3rem)/1.05 "Fraunces",Georgia,serif; letter-spacing:-.02em; margin:0 0 12px; }
    h1 em { font-style:italic; }
    p { color:var(--gris); margin:0 0 20px; }
    .nota { font:500 1.4rem "Caveat",cursive; color:var(--rosa); display:block; margin-bottom:6px; transform:rotate(-2deg); }
    form { margin:0 0 10px; }
    label { display:block; text-align:left; font-size:.9rem; color:var(--gris); margin-bottom:6px; }
    input[type=email] { width:100%; padding:14px 18px; border-radius:999px; border:1px solid var(--linea); background:#fff;
           font:1rem "Inter",sans-serif; color:var(--tinta); margin-bottom:10px; }
    input[type=email]:focus { outline:2px solid var(--tinta); outline-offset:1px; }
    #codigo { width:100%; padding:12px 18px; border-radius:999px; border:1px solid var(--linea); background:#fff; font:500 1.35rem "Inter",sans-serif;
           letter-spacing:.3em; text-align:center; color:var(--tinta); margin-bottom:10px; }
    #codigo:focus { outline:2px solid var(--tinta); outline-offset:1px; }
    #porCodigo { margin-top:6px; }
    button, a.boton { display:block; width:100%; padding:14px 20px; border-radius:999px; font:500 1rem "Inter",sans-serif;
           cursor:pointer; text-decoration:none; margin-bottom:10px; border:1px solid var(--tinta); }
    button { background:var(--tinta); color:var(--crema); }
    button:disabled { opacity:.6; cursor:default; }
    button.claro, a.boton { background:transparent; color:var(--tinta); }
    #estado { font-size:.95rem; min-height:1.5em; }
    #estado b { color:var(--tinta); font-weight:500; }
    [hidden] { display:none !important; }
    footer { margin-top:32px; font-size:.85rem; color:var(--gris); }
    footer a { color:inherit; }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="8f2ba4b0-e3aa-4d28-b1ec-282e448736f8" data-domains="mirardespacio.es" data-exclude-search="true"></script>
  <link rel="manifest" href="/app.webmanifest">
  <meta name="theme-color" content="#1a1814">
  <link rel="apple-touch-icon" href="/assets/app-180.png">
  <meta name="apple-mobile-web-app-title" content="Mirar Despacio">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <main>
    <img src="/assets/logo-md-ig.png" alt="Mirar Despacio">
    <span class="nota" id="nota">para socios</span>
    <h1>Mirar Despacio<em id="mas">+</em></h1>
    <p id="estado">Escribe tu email y te mando un enlace para entrar. Sin contraseñas.</p>
    <form id="pedir" hidden>
      <label for="email">Tu email (el mismo con el que te apuntaste)</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@email.com">
      <button type="submit" id="enviar">Enviarme el enlace</button>
    </form>
    <form id="porCodigo" hidden>
      <label for="codigo">¿Usas la app en el móvil? Escribe aquí el código de 6 cifras del correo</label>
      <input type="text" id="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="000 000" required>
      <button type="submit" class="claro" id="entrarCodigo">Entrar con el código</button>
    </form>
    <form id="confirmar" hidden>
      <label for="email2">Para terminar de entrar, escribe tu email</label>
      <input type="email" id="email2" autocomplete="email" required>
      <button type="submit">Entrar</button>
    </form>
    <a class="boton" id="irSuyo" hidden href="/"></a>
    <button class="claro" id="salir" hidden>Cerrar sesión</button>
    <a class="boton" id="hazte" href="/mirar-despacio-plus/">¿Aún no eres de Mirar Despacio+?</a>
    <footer><a href="/">mirardespacio.es</a> · <a href="mailto:info@mirardespacio.es">info@mirardespacio.es</a></footer>
  </main>

  <script src="/js/sesion.js" data-manual="si"></script>
  <script>
    // Página única de acceso a la zona de socios.
    //  ?a=socios|retos|cuaderno|manual-<id>  -> a qué se quiere entrar (cambia el texto y el destino)
    //  ?volver=/ruta                          -> página a la que volver (la pone la función edge)
    //  ?e=email                               -> email ya escrito (viene de la invitación o del enlace)
    //  ?sin=1                                 -> tiene sesión pero no ese acceso
    // Los enlaces del correo traen además oobCode/mode=signIn (los añade Firebase).
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var q = new URLSearchParams(location.search);
      var A = q.get('a') || '';
      var EMAIL = (q.get('e') || '').trim().toLowerCase();
      // ¿Abierta como app instalada? (en el iPhone no comparte sesión con Safari: se entra con el código)
      var APP = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      var estado = $('estado');
      var S = window.mdSesion;
      var DESTINOS = { socios: '/socios/', retos: '/retos/', cuaderno: '/cuaderno/' };
      var manualPedido = (A.match(/^manual-([a-z0-9-]+)$/) || [])[1] || '';

      // Al manual o al cuaderno entra gente que no es de MD+: ahí el título va sin el «+»
      if (manualPedido) { $('nota').textContent = 'manual del taller'; $('hazte').hidden = true; $('mas').hidden = true; }
      else if (A === 'cuaderno') { $('nota').textContent = 'tu cuaderno de fotos'; $('hazte').hidden = true; $('mas').hidden = true; }
      if (EMAIL) { $('email').value = EMAIL; $('email2').value = EMAIL; }

      function texto(html) { estado.innerHTML = html; }
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function intentos(n) {
        try {
          if (n === undefined) return parseInt(sessionStorage.getItem('md_intentos') || '0', 10);
          sessionStorage.setItem('md_intentos', String(n));
        } catch (e) { return 0; }
      }
      // Solo rutas de la propia web y de la zona de socios
      function volverValido() {
        var v = q.get('volver') || '';
        return /^\/(socios|retos|cuaderno|manuales)(\/|$|\?)/.test(v) && v.indexOf('//') === -1 ? v : '';
      }
      function puede(r, ruta) {
        var plus = r.indexOf('member') !== -1 || r.indexOf('admin') !== -1;
        var m = ruta.match(/^\/manuales\/([a-z0-9-]+)/);
        if (m) return r.indexOf('admin') !== -1 || r.indexOf('taller-' + m[1]) !== -1;
        if (/^\/manuales/.test(ruta)) return r.indexOf('admin') !== -1;
        if (/^\/cuaderno/.test(ruta)) return plus || r.indexOf('participante') !== -1;
        return plus;
      }
      function destinoPara(r) {
        var v = volverValido();
        if (v && puede(r, v)) return v;
        var pedido = manualPedido ? '/manuales/' + manualPedido + '/' : DESTINOS[A] || '';
        if (pedido && puede(r, pedido)) return pedido;
        if (pedido) return '';                      // pidió algo concreto que no tiene
        if (puede(r, '/socios/')) return '/socios/';
        if (puede(r, '/cuaderno/')) return '/cuaderno/';
        var mans = r.filter(function (x) { return /^taller-/.test(x); });
        return mans.length ? '/manuales/' + mans[0].slice(7) + '/' : '';
      }

      function dentro(u) {
        $('pedir').hidden = true; $('confirmar').hidden = true; $('salir').hidden = false;
        var r = (u.app_metadata && u.app_metadata.roles) || [];
        var ir = destinoPara(r);
        if (!ir) {
          if (manualPedido) texto('Has entrado como <b>' + esc(u.email) + '</b>, pero el manual de ese taller solo lo tiene quien se ha apuntado a él. Si te has apuntado, escríbeme y te doy acceso.');
          else if (!r.length) texto('Has entrado como <b>' + esc(u.email) + '</b>, pero ahora mismo tu cuenta no tiene acceso activo. Tus fotos y comentarios siguen guardados: escríbeme y lo reactivo.');
          else texto('Has entrado como <b>' + esc(u.email) + '</b>, pero tu cuenta no tiene acceso a esa parte. Si crees que es un error, escríbeme.');
          // Lo que sí tiene, a un toque
          var suyo = r.length ? (puede(r, '/socios/') ? '/socios/' : puede(r, '/cuaderno/') ? '/cuaderno/' : '') : '';
          var mans = r.filter(function (x) { return /^taller-/.test(x); });
          if (!suyo && mans.length) suyo = '/manuales/' + mans[0].slice(7) + '/';
          if (suyo) { var ir2 = $('irSuyo'); ir2.href = suyo; ir2.textContent = suyo === '/socios/' ? 'Ir a Mirar Despacio+' : suyo === '/cuaderno/' ? 'Ir a mi cuaderno de fotos' : 'Ir al manual de mi taller'; ir2.hidden = false; $('hazte').hidden = true; }
          return;
        }
        if (intentos() >= 2) {
          intentos(0);
          texto('No se ha podido abrir la zona de socios. Cierra sesión y vuelve a entrar; si sigue pasando, escríbeme.');
          return;
        }
        intentos(intentos() + 1);
        texto('Entrando…');
        location.replace(ir);
      }
      function fuera(msg) {
        $('salir').hidden = true; $('pedir').hidden = false; $('confirmar').hidden = true;
        texto(msg || (manualPedido ? 'Escribe el email con el que te apuntaste al taller y te mando un enlace para abrir el manual.'
          : 'Escribe tu email y te mando un enlace para entrar. Sin contraseñas.'));
      }

      $('pedir').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var email = $('email').value.trim().toLowerCase();
        if (!email) return;
        $('enviar').disabled = true;
        texto('Enviando…');
        try { localStorage.setItem('md_email', email); } catch (e) { /* nada */ }
        fetch('/api/socios/enlace', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, a: A }) })
          .then(function (r) {
            if (r.status === 429) throw new Error('demasiadas');
            if (!r.ok) throw new Error('error');
            texto('Listo. Si <b>' + esc(email) + '</b> tiene acceso, te acaba de llegar un correo con el enlace para entrar. Mira también en spam o promociones.');
            $('porCodigo').hidden = false;
            if (APP) { $('pedir').hidden = true; $('codigo').focus(); texto('Te acabo de mandar un correo a <b>' + esc(email) + '</b>. Copia aquí el código de 6 cifras (si pulsas el enlace, se abriría el navegador y no la app).'); }
            try { if (window.umami) umami.track('acceso-enlace'); } catch (e) { /* nada */ }
          })
          .catch(function (e) {
            texto(e.message === 'demasiadas' ? 'Has pedido muchos enlaces seguidos. Espera un rato y vuelve a probar.' : 'No se ha podido enviar ahora mismo. Prueba en unos minutos o escríbeme a info@mirardespacio.es.');
          })
          .then(function () { $('enviar').disabled = false; });
      });

      // Entrar con el código del correo (la app instalada en el iPhone no comparte sesión con Safari)
      $('porCodigo').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var email = ($('email').value || EMAIL || '').trim().toLowerCase();
        var cod = $('codigo').value.replace(/\D/g, '');
        if (!email) { texto('Escribe primero tu email arriba.'); $('pedir').hidden = false; return; }
        $('entrarCodigo').disabled = true; texto('Comprobando…');
        fetch('/api/socios/codigo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, codigo: cod }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw Object.assign(new Error(j.error || 'error'), { j: j }); return j; }); })
          .then(function (j) { try { if (window.umami) umami.track('acceso-codigo'); } catch (e) { /* nada */ } entrarCon(email, j.enlace); })
          .catch(function (e) {
            $('entrarCodigo').disabled = false;
            texto(e.message === 'codigo' ? 'Ese código no es correcto. Revísalo' + (e.j && e.j.quedan != null ? ' (te quedan ' + e.j.quedan + ' intentos)' : '') + '.'
              : e.message === 'caducado' ? 'Ese código ya no vale. Pide otro correo aquí arriba.' : e.message === 'demasiadas' ? 'Demasiados intentos. Espera un rato.' : 'No se ha podido comprobar. Prueba otra vez.');
            if (e.message === 'caducado') { $('pedir').hidden = false; $('porCodigo').hidden = true; }
          });
      });

      $('salir').addEventListener('click', function () {
        intentos(0);
        S.logout().then(function () { fuera('Has cerrado sesión.'); });
      });

      // Entra con un enlace de Firebase: el del correo (la dirección actual) o el que devuelve el código
      function entrarCon(mail, enlace) {
        texto('Entrando…');
        S._cargar().then(function (F) {
          return F.signInWithEmailLink(S._auth(), mail, enlace);
        }).then(function (cred) {
          try { localStorage.removeItem('md_email'); } catch (e) { /* nada */ }
          // Quita el código del enlace de la barra de direcciones (no se puede usar dos veces)
          var limpia = new URLSearchParams(location.search);
          ['oobCode', 'mode', 'apiKey', 'lang', 'continueUrl'].forEach(function (k) { limpia.delete(k); });
          history.replaceState(null, '', location.pathname + (limpia.toString() ? '?' + limpia : ''));
          return S._sesionServidor(cred.user, true);
        }).then(function (d) {
          // Se entra con lo que acaba de devolver el servidor (no hay que esperar a la sesión de Firebase:
          // si la página ya la había comprobado antes, sin sesión, ese aviso ya pasó)
          intentos(0);
          $('porCodigo').hidden = true;
          dentro({ email: d.email, app_metadata: { roles: d.roles || [] } });
        }).catch(function (e) {
          console.warn(e);
          var caducado = /expired|invalid-action-code/.test(e.code || '');
          fuera(caducado ? 'Ese enlace ya se ha usado o ha caducado. Pide otro aquí abajo.' : (e.sinCuenta ? 'Tu email no tiene ninguna cuenta activa. Si crees que es un error, escríbeme a info@mirardespacio.es.' : 'No se ha podido entrar con ese enlace. Pide otro aquí abajo.'));
        });
      }

      // ¿Viene del enlace del correo?
      S._cargar().then(function (F) {
        var auth = S._auth();
        if (F.isSignInWithEmailLink(auth, location.href)) {
          var guardado = '';
          try { guardado = localStorage.getItem('md_email') || ''; } catch (e) { /* nada */ }
          var email = EMAIL || guardado;
          var entrar = function (mail) { entrarCon(mail, location.href); };
          if (email) entrar(email);
          else {
            // Abierto en otro dispositivo: se pide el email para comprobar que es suyo
            texto('Casi estás.');
            $('confirmar').hidden = false;
            $('confirmar').addEventListener('submit', function (ev) { ev.preventDefault(); entrar($('email2').value.trim().toLowerCase()); });
          }
          return;
        }
        S._arrancar();
        S.on('init', function (u) {
          if (u) dentro(u);
          else fuera(q.get('sin') ? 'Entra con tu email para seguir.' : '');
        });
      }).catch(function () { texto('No se ha podido cargar el acceso. Recarga la página.'); });
    })();
  </script>
</body>
</html>
