# -----------------------------------------------
# NETLIFY CONFIGURATION — ottokols.es
# -----------------------------------------------
[build]
  publish = "PortfolioOtto"
  # Solo construye si cambia algo de ottokols.es (los cambios de MirarDespacio/ no gastan build aquí)
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- PortfolioOtto netlify netlify.toml package.json package-lock.json"

# La clave web de Firebase (AIza…) es pública por diseño: va en el navegador y la
# protegen las reglas de Firestore. El escáner de secretos de Netlify (plan Pro) la
# marca como sospechosa y para el deploy; se la indicamos como conocida.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDfRTs1pF5-iV2dlNFY-dlFv4A-HcxZeTk"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# -----------------------------------------------
# HEADERS /members/ — sin indexar
# -----------------------------------------------
[[headers]]
  for = "/members/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/recursos.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/emails/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/crm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# -----------------------------------------------
# ÁREA DE MIEMBROS — protección en el servidor
# Solo entra quien tiene sesión de Netlify Identity con rol "member".
# El rol se asigna solo al registrarse (netlify/functions/identity-signup.js);
# a los miembros que ya existían hay que ponérselo a mano una vez.
# -----------------------------------------------
[[redirects]]
  from       = "/members/*"
  to         = "/members/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["member", "admin"]}

[[redirects]]
  from   = "/members/*"
  to     = "/acceso.html"
  status = 302
  force  = true

[[redirects]]
  from       = "/recursos.html"
  to         = "/recursos.html"
  status     = 200
  force      = true
  conditions = {Role = ["member", "admin"]}

[[redirects]]
  from   = "/recursos.html"
  to     = "/acceso.html"
  status = 302
  force  = true

# Copias antiguas de las herramientas que estaban abiertas en la raíz
[[redirects]]
  from   = "/composicion.html"
  to     = "/members/composicion.html"
  status = 301
[[redirects]]
  from   = "/dof-calculator.html"
  to     = "/members/dof-calculator.html"
  status = 301
[[redirects]]
  from   = "/receta-fotografica.html"
  to     = "/members/receta-fotografica.html"
  status = 301
[[redirects]]
  from   = "/simulador-visual.html"
  to     = "/members/simulador-visual.html"
  status = 301

# -----------------------------------------------
# REDIRECTS — mirardespacio.es (antiguo)
# Dejan de aplicarse en cuanto mirardespacio.es se quite de este sitio
# y se añada al nuevo sitio de Netlify. Se pueden borrar después.
# -----------------------------------------------
[[redirects]]
  from   = "https://mirardespacio.es/*"
  to     = "https://ottokols.es/salidas.html?utm_source=mirardespacio&utm_medium=redirect&utm_campaign=dominio_directo"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.mirardespacio.es/*"
  to     = "https://ottokols.es/salidas.html?utm_source=mirardespacio&utm_medium=redirect&utm_campaign=dominio_directo"
  status = 301
  force  = true

# Las salidas ahora viven en mirardespacio.es
[[redirects]]
  from   = "/salidas.html"
  to     = "https://mirardespacio.es/salidas/"
  status = 301
  force  = true

[[redirects]]
  from   = "/salidas-data.json"
  to     = "https://mirardespacio.es/salidas-data.json"
  status = 301
  force  = true

# -----------------------------------------------
# REDIRECTS GENERALES
# -----------------------------------------------
[[redirects]]
  from   = "https://www.ottokols.es/*"
  to     = "https://ottokols.es/:splat"
  status = 301
  force  = true
