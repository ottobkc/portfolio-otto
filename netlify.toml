# -----------------------------------------------
# NETLIFY CONFIGURATION — ottokols.es
# -----------------------------------------------
[build]
  publish = "PortfolioOtto"
  # Solo construye si cambia algo de ottokols.es (los cambios de MirarDespacio/ no gastan build aquí,
  # salvo el núcleo del juego del triángulo, que también usa la función del servidor)
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- PortfolioOtto netlify netlify.toml package.json package-lock.json MirarDespacio/assets/triangulo-nucleo.js"

# La clave web de Firebase (AIza…) es pública por diseño: va en el navegador y la
# protegen las reglas de Firestore. El escáner de secretos de Netlify (plan Pro) la
# marca como sospechosa y para el deploy; se la indicamos como conocida.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDfRTs1pF5-iV2dlNFY-dlFv4A-HcxZeTk"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Tareas semanales (lunes, hora UTC): limpieza de fotos antiguas y copia de seguridad del CRM
[functions."tareas-diarias"]
  schedule = "15 7 * * *"

[functions."limpieza-fotos"]
  schedule = "0 4 * * 1"

[functions."copia-seguridad"]
  schedule = "0 6 * * 1"

# -----------------------------------------------
# HEADERS /members/ — sin indexar
# -----------------------------------------------
# -----------------------------------------------
# SEGURIDAD — en todas las páginas
# Que ninguna otra web pueda meter estas páginas en un marco, HTTPS siempre, etc.
# -----------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

[[headers]]
  for = "/members/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/recursos.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/emails/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/retos/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cuaderno/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/subir/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Galerías privadas de clientes: sin indexar y sin pasar la URL (lleva el código) a otras webs
[[headers]]
  for = "/galeria/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/manuales/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/crm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# -----------------------------------------------
# ÁREA DE MIEMBROS — protección en el servidor
# Solo entra quien tiene sesión de Netlify Identity con rol "member".
# El rol lo pone el CRM (o el pago) al invitar; quien se registre sin invitación entra sin acceso.
# -----------------------------------------------
[[redirects]]
  from       = "/members/*"
  to         = "/members/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["member", "admin"]}

[[redirects]]
  from   = "/members/*"
  to     = "/acceso.html"
  status = 302
  force  = true

[[redirects]]
  from       = "/recursos.html"
  to         = "/recursos.html"
  status     = 200
  force      = true
  conditions = {Role = ["member", "admin"]}

[[redirects]]
  from   = "/recursos.html"
  to     = "/acceso.html"
  status = 302
  force  = true

# Reto del mes: solo Mirar Despacio+ (también la suscripción online, sin salidas)
[[redirects]]
  from       = "/retos/*"
  to         = "/retos/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["member", "admin"]}

[[redirects]]
  from   = "/retos/*"
  to     = "/acceso.html?a=retos"
  status = 302
  force  = true

# Fotos de las salidas: lo abren los miembros MD+ y también quien solo tiene acceso
# "participante" (gente de las salidas que sube sus fotos sin ser MD+).
[[redirects]]
  from       = "/cuaderno/*"
  to         = "/cuaderno/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["member", "participante", "admin"]}

[[redirects]]
  from   = "/cuaderno/*"
  to     = "/acceso.html?a=cuaderno"
  status = 302
  force  = true

# Manuales de los talleres: cada uno solo lo abre quien tiene su rol "taller-<id>"
# (quien pagó ese taller, canjeó un bono de ese taller o recibió el acceso desde el CRM).
# Ser MD+ NO da acceso. Un manual nuevo = copiar esta pareja de reglas y cambiar el id
# (y ponerlo en netlify/lib/manuales.js).
[[redirects]]
  from       = "/manuales/atardecer/*"
  to         = "/manuales/atardecer/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["taller-atardecer", "admin"]}

[[redirects]]
  from   = "/manuales/atardecer/*"
  to     = "/acceso.html?a=manual-atardecer"
  status = 302
  force  = true

[[redirects]]
  from       = "/manuales/nocturna/*"
  to         = "/manuales/nocturna/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["taller-nocturna", "admin"]}

[[redirects]]
  from   = "/manuales/nocturna/*"
  to     = "/acceso.html?a=manual-nocturna"
  status = 302
  force  = true

[[redirects]]
  from       = "/manuales/composicion/*"
  to         = "/manuales/composicion/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["taller-composicion", "admin"]}

[[redirects]]
  from   = "/manuales/composicion/*"
  to     = "/acceso.html?a=manual-composicion"
  status = 302
  force  = true

[[redirects]]
  from       = "/manuales/iniciacion/*"
  to         = "/manuales/iniciacion/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["taller-iniciacion", "admin"]}

[[redirects]]
  from   = "/manuales/iniciacion/*"
  to     = "/acceso.html?a=manual-iniciacion"
  status = 302
  force  = true

# Cualquier otra ruta de /manuales/ (manuales aún sin publicar) no se sirve a nadie
[[redirects]]
  from       = "/manuales/*"
  to         = "/manuales/:splat"
  status     = 200
  force      = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from   = "/manuales/*"
  to     = "/acceso.html"
  status = 302
  force  = true

# Copias antiguas de las herramientas que estaban abiertas en la raíz
[[redirects]]
  from   = "/composicion.html"
  to     = "/members/composicion.html"
  status = 301
[[redirects]]
  from   = "/dof-calculator.html"
  to     = "/members/dof-calculator.html"
  status = 301
[[redirects]]
  from   = "/receta-fotografica.html"
  to     = "/members/receta-fotografica.html"
  status = 301
[[redirects]]
  from   = "/simulador-visual.html"
  to     = "/members/simulador-visual.html"
  status = 301

# Las salidas ahora viven en mirardespacio.es
[[redirects]]
  from   = "/salidas.html"
  to     = "https://mirardespacio.es/salidas/"
  status = 301
  force  = true

[[redirects]]
  from   = "/salidas-data.json"
  to     = "https://mirardespacio.es/salidas-data.json"
  status = 301
  force  = true

# -----------------------------------------------
# REDIRECTS GENERALES
# -----------------------------------------------
[[redirects]]
  from   = "https://www.ottokols.es/*"
  to     = "https://ottokols.es/:splat"
  status = 301
  force  = true
