<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Mirar Despacio+</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Inter:wght@400;500&display=swap">
  <style>
    :root { --crema:#f5f3ef; --tinta:#1a1814; --gris:#6b655a; --linea:#d8d2c6; --degradado:linear-gradient(100deg,#e8821a,#e8347a); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--crema); color:var(--tinta);
           font:17px/1.6 "Inter",system-ui,sans-serif; padding:24px 16px; }
    main { width:100%; max-width:420px; text-align:center; }
    img { width:64px; height:64px; object-fit:contain; margin:0 auto 20px; display:block; }
    h1 { font:400 clamp(2.2rem,8vw,3rem)/1.05 "Fraunces",Georgia,serif; letter-spacing:-.02em; margin:0 0 12px; }
    h1 em { font-style:italic; }
    p { color:var(--gris); margin:0 0 24px; }
    .nota { font:500 1.4rem "Caveat",cursive; color:#e8347a; display:block; margin-bottom:6px; transform:rotate(-2deg); }
    button, a.boton { display:block; width:100%; padding:14px 20px; border-radius:999px; font:500 1rem "Inter",sans-serif;
           cursor:pointer; text-decoration:none; margin-bottom:10px; border:1px solid var(--tinta); }
    button { background:var(--tinta); color:var(--crema); }
    a.boton { background:transparent; color:var(--tinta); }
    #estado { font-size:.9rem; min-height:1.5em; }
    footer { margin-top:32px; font-size:.85rem; color:var(--gris); }
    footer a { color:inherit; }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="8f2ba4b0-e3aa-4d28-b1ec-282e448736f8"></script>
</head>
<body>
  <main>
    <img src="https://res.cloudinary.com/dybxateci/image/upload/w_128/v1785276700/logoMD_gizjap.png" alt="Mirar Despacio">
    <span class="nota">para miembros</span>
    <h1>Mirar Despacio<em>+</em></h1>
    <p id="estado">Entra con el email con el que te invité.</p>
    <button id="entrar">Entrar</button>
    <a class="boton" href="https://mirardespacio.es/mirar-despacio-plus/">¿Aún no eres miembro?</a>
    <footer><a href="https://mirardespacio.es/">mirardespacio.es</a> · <a href="/">ottokols.es</a></footer>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Página única de acceso al área de miembros.
    // También recibe los enlaces de los emails de Netlify Identity
    // (invitación, confirmación y recuperar contraseña): el widget los detecta en la URL.
    (function () {
      var estado = document.getElementById('estado');
      var boton = document.getElementById('entrar');
      if (typeof netlifyIdentity === 'undefined') {
        estado.textContent = 'No se ha podido cargar el acceso. Recarga la página.';
        boton.disabled = true;
        return;
      }
      var ir = function () { location.replace('/recursos.html'); };
      netlifyIdentity.on('init', function (user) {
        // Con un token en la URL dejamos que el widget muestre su formulario.
        if (user && !/_token=/.test(location.hash)) {
          estado.textContent = 'Ya tienes sesión abierta, entrando…';
          ir();
        }
      });
      netlifyIdentity.on('login', function () { netlifyIdentity.close(); ir(); });
      boton.addEventListener('click', function () { netlifyIdentity.open('login'); });
      netlifyIdentity.init();
    })();
  </script>
</body>
</html>
