<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirma tu nuevo email</title></head>
<body style="margin:0;padding:0;background:#f5f3ef;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f3ef;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e3ded4;">
        <tr><td style="padding:32px 32px 8px;text-align:center;">
          <img src="https://res.cloudinary.com/dybxateci/image/upload/w_160/v1785276700/logoMD_gizjap.png" width="80" alt="Mirar Despacio" style="display:inline-block;">
        </td></tr>
        <tr><td style="padding:8px 32px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;color:#1a1814;text-align:center;">
          Confirma tu nuevo email
        </td></tr>
        <tr><td style="padding:16px 32px 0;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#4a453c;">
          <p style="margin:0 0 12px;">Hola,</p><p style="margin:0 0 12px;">Has pedido cambiar el email de tu cuenta de Mirar Despacio+ a {{ .NewEmail }}. Pulsa el botón para confirmarlo.</p>
        </td></tr>
        <tr><td align="center" style="padding:28px 32px;">
          <a href="{{ .SiteURL }}/acceso.html#email_change_token={{ .Token }}" style="display:inline-block;background:#1a1814;color:#f5f3ef;font-family:Helvetica,Arial,sans-serif;font-size:16px;text-decoration:none;padding:14px 28px;border-radius:999px;">Confirmar el cambio</a>
        </td></tr>
        <tr><td style="padding:0 32px 28px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#8a8477;">
          Si no lo has pedido tú, ignora este correo y escríbeme.
        </td></tr>
        <tr><td style="padding:16px 32px;border-top:1px solid #e3ded4;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8a8477;text-align:center;">
          Mirar Despacio · <a href="https://mirardespacio.es" style="color:#8a8477;">mirardespacio.es</a> · Otto
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
